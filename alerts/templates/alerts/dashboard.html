<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOC Real-Time Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #0a0e27;
            color: #e0e0e0;
            font-family: 'Courier New', monospace;
            min-height: 100vh;
            padding: 20px;
        }

        .container { max-width: 1400px; margin: 0 auto; }

        h1 {
            text-align: center;
            margin-bottom: 40px;
            color: #00ff88;
            text-shadow: 0 0 10px #00ff88;
        }

        .metrics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .metric-card {
            background: #1a1f3a;
            border: 2px solid #00ff88;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s;
        }

        .metric-card h2 {
            font-size: 14px;
            color: #00ff88;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .metric-value {
            font-size: 48px;
            font-weight: bold;
            margin: 10px 0;
        }

        .critical { color: #ff3333; }
        .high { color: #ff9933; }
        .medium { color: #ffff33; }

        .pulse { animation: pulse 1s infinite; }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .status { font-size: 12px; margin-top: 10px; color: #888; }

        .attention-banner {
            background: rgba(255, 51, 51, 0.2);
            border: 2px solid #ff3333;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 8px;
            display: none;
        }
        .attention-banner.active {
            display: block;
            animation: blink 0.5s infinite;
        }
        @keyframes blink {
            0%, 50%, 100% { opacity: 1; }
            25%, 75% { opacity: 0.7; }
        }
        .attention-banner h3 { color: #ff3333; margin-bottom: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚨 SOC Real-Time Dashboard</h1>

        <div class="attention-banner" id="attention">
            <h3>⚠️ IMMEDIATE ATTENTION REQUIRED</h3>
            <p>Critical alerts detected - escalate to incident response team</p>
        </div>

        <div class="metrics">
            <div class="metric-card">
                <h2>Critical Open</h2>
                <div class="metric-value critical" id="critical_open">0</div>
                <div class="status" id="critical_status">Waiting for data...</div>
            </div>

            <div class="metric-card">
                <h2>High Open</h2>
                <div class="metric-value high" id="high_open">0</div>
                <div class="status" id="high_status">Waiting for data...</div>
            </div>

            <div class="metric-card">
                <h2>Total Open</h2>
                <div class="metric-value medium" id="total_open">0</div>
                <div class="status" id="total_status">Waiting for data...</div>
            </div>

            <div class="metric-card">
                <h2>Connection Status</h2>
                <div class="metric-value" id="connection_status" style="font-size: 24px; color: #ff9933;">CONNECTING...</div>
                <div class="status">Real-time updates</div>
            </div>
        </div>
    </div>

    <script>
        const MAX_DELAY = 30000;
        let retryDelay = 1000;

        function setStatus(text, color) {
            const el = document.getElementById('connection_status');
            el.textContent = text;
            el.style.color = color;
        }

        function updateDashboard(data) {
            const now = new Date().toLocaleTimeString();
            document.getElementById('critical_open').textContent = data.critical_open;
            document.getElementById('high_open').textContent = data.high_open;
            document.getElementById('total_open').textContent = data.total_open;

            ['critical_status', 'high_status', 'total_status'].forEach(id => {
                document.getElementById(id).textContent = `Last update: ${now}`;
            });

            const banner = document.getElementById('attention');
            const critical = document.getElementById('critical_open');
            if (data.needs_immediate_attention) {
                banner.classList.add('active');
                critical.classList.add('pulse');
            } else {
                banner.classList.remove('active');
                critical.classList.remove('pulse');
            }
        }

        async function fetchInitialData() {
            try {
                const response = await fetch('/api/alert-count/', { credentials: 'same-origin' });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                updateDashboard(await response.json());
            } catch (error) {
                console.error('Error fetching data:', error);
            }
        }

        function connect() {
            const proto = window.location.protocol === 'https:' ? 'wss' : 'ws';
            const ws = new WebSocket(`${proto}://${window.location.host}/ws/dashboard/`);

            ws.onopen = () => {
                retryDelay = 1000;
                setStatus('🟢 LIVE', '#00ff88');
                fetchInitialData();  // resync anything missed while disconnected
            };

            ws.onmessage = (e) => updateDashboard(JSON.parse(e.data));

            ws.onclose = (e) => {
                // 4401 = server rejected us as unauthenticated; retrying won't help
                if (e.code === 4401) {
                    setStatus('🔴 LOGIN REQUIRED', '#ff3333');
                    return;
                }
                setStatus(`🟡 RECONNECTING in ${retryDelay / 1000}s`, '#ff9933');
                setTimeout(connect, retryDelay);
                retryDelay = Math.min(retryDelay * 2, MAX_DELAY);
            };
        }

        connect();
    </script>
</body>
</html>
