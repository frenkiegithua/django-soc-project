<!DOCTYPE html>
<html>
<head>
    <title>SOC Alert Dashboard</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background: #f5f5f5; 
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            border-bottom: 2px solid #d9534f;
            padding-bottom: 10px;
        }
        .alert-count {
            background: #ecf0f1;
            padding: 10px;
            border-radius: 3px;
            margin: 10px 0;
        }
        .alert-list {
            list-style: none;
            padding: 0;
        }
        .alert-item {
            background: #f9f9f9;
            border-left: 4px solid #d9534f;
            padding: 15px;
            margin: 10px 0;
            border-radius: 3px;
        }
        .severity-high {
            border-left-color: #d9534f;
            background: #fdeaea;
        }
        .severity-critical {
            border-left-color: #c0392b;
            background: #fadbd8;
        }
        .severity-medium {
            border-left-color: #f39c12;
            background: #fef5e7;
        }
        .event {
            font-weight: bold;
            font-size: 1.1em;
            color: #333;
        }
        .details {
            margin-top: 10px;
            font-size: 0.9em;
            color: #555;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚨 SOC Alert Dashboard</h1>
        
        <div class="alert-count">
    <strong>Total Alerts:</strong> {{ total_alerts }}
    <a href="{% url 'create_alert' %}" style="float: right; color: #d9534f; text-decoration: none; font-weight: bold;">
        + Create Alert
    </a>
</div>

        <ul class="alert-list">
            {% for alert in alerts %}
                <li class="alert-item severity-{{ alert.severity|lower }}">
                    <div class="event">{{ alert.event }}</div>
                    <div class="details">
                        <strong>Severity:</strong> {{ alert.severity }} | 
                        <strong>Source IP:</strong> {{ alert.source_ip }} | 
                        <strong>Destination IP:</strong> {{ alert.destination_ip }} | 
                        <strong>Time:</strong> {{ alert.timestamp }}
                    </div>
                </li>
            {% endfor %}
        </ul>
    </div>
</body>
</html>
