<!DOCTYPE html>
<html>
<head>
    <title>Create Security Alert</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background: #f5f5f5; 
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            border-bottom: 2px solid #d9534f;
            padding-bottom: 10px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            color: #333;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 3px;
            font-size: 1em;
            box-sizing: border-box;
        }
        input:focus, select:focus {
            border-color: #d9534f;
            outline: none;
        }
        .error {
            color: #d9534f;
            font-size: 0.9em;
            margin-top: 5px;
        }
        button {
            background: #d9534f;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 3px;
            font-size: 1em;
            cursor: pointer;
        }
        button:hover {
            background: #c0392b;
        }
        .success {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 3px;
            margin-bottom: 20px;
        }
        .nav {
            margin-top: 20px;
        }
        .nav a {
            color: #d9534f;
            text-decoration: none;
        }
        .nav a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚨 Create Security Alert</h1>

        {% if success %}
            <div class="success">
                ✅ {{ message }}
            </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}  <!-- IMPORTANT: Prevents CSRF attacks -->

            {% for field in form %}
                <div class="form-group">
                    {{ field.label_tag }}
                    {{ field }}
                    
                    {% if field.errors %}
                        <div class="error">
                            {% for error in field.errors %}
                                {{ error }}
                            {% endfor %}
                        </div>
                    {% endif %}
                </div>
            {% endfor %}

            <button type="submit">Create Alert</button>
        </form>

        <div class="nav">
            <a href="{% url 'alert_list' %}">← Back to Alerts</a>
        </div>
    </div>
</body>
</html>
